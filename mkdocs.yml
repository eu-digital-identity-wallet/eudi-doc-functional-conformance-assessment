# ============================================================
# eudi-doc-functional-conformance-assessment (conformance.eudi.dev)
# Theme / markdown / plugins mirror the ARF canonical config.
# Site-specific: nav, repo_url, asset paths, include-markdown plugin,
#                precond_alpha hook + media/css/fcaf.css overrides.
# Mermaid: the superfences custom_fence emits <pre class="mermaid">, but the
#          runtime is loaded via a self-hosted extra_javascript include (see
#          bottom of file). Material's built-in mermaid loader is NOT relied on
#          here: with the privacy plugin it self-hosts mermaid under an absolute
#          site_url path (/assets/external/...), which 404s under mike's
#          versioned subpaths (/latest/, /x.y.z/). The self-hosted include uses
#          a page-relative URL, so it resolves correctly under every mike alias.
# ============================================================

site_name: European Digital Identity
site_author: European Commission - DG CNECT
site_url: https://conformance.eudi.dev
repo_url: https://github.com/eu-digital-identity-wallet/eudi-doc-functional-conformance-assessment
repo_name: eu-digital-identity-wallet/eudi-doc-functional-conformance-assessment
edit_uri: edit/site/docs/
copyright: European Union, 2025 - Licensed under the EUPL-1.2 or later

# ---------------- SHARED THEME BLOCK (identical to ARF) ----------------
theme:
  name: material
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
  logo: media/images/logo_eudi_white.svg
  favicon: media/images/favicon.ico

extra_css:
  - media/css/extra.css          # shared canonical theme (same file contents everywhere)
  - media/css/fcaf.css           # site-specific overrides; MUST load after extra.css

# ---------------- SHARED MARKDOWN BLOCK (identical to ARF, minus snippets) ----------------
markdown_extensions:
  - footnotes
  - sane_lists
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # toc_depth=4 stops the (integrated) nav at the
  # structural area/group level (h1-h4); test-case IDs render as h5 and their
  # sub-items (Objective, References, ...) as h6, so they stay out of the nav.
  - toc:
      toc_depth: 4
      permalink: true
      permalink_title: Link to this section

# ---------------- SHARED PLUGINS BLOCK + site-specific include-markdown ----------------
plugins:
  - search
  - tags
  - privacy
  # - social
  #   Disabled: the social plugin renders one preview PNG per page. At the
  #   current corpus size that was 641 images / 26 MB in `draft` alone, and the
  #   `latest` + `latest-draft` aliases materialize `draft` twice more, so it
  #   cost ~1,900 files / 78 MB in every full GitHub Pages sync. That pushed the
  #   sync past the fixed ~10 minute Pages ceiling. Re-enable only together with
  #   a publication model that does not resync the whole version archive.
  - mike
  - include-markdown            # conformance-specific

# ---------------- SITE-SPECIFIC hooks ----------------
# Adds the `precond-alpha` class to the <ol> after a "Preconditions" heading so
# media/css/fcaf.css can render it with upper-alpha (A./B./C.) markers.
hooks:
  - hooks/precond_alpha.py
  - hooks/fcaf_nav.py
  # Repoints the edit / view-source buttons at the branch each page lives on.
  # edit_uri below is only the fallback for pages the hook does not touch.
  - hooks/fcaf_edit_urls.py

extra:
  version:
    provider: mike
    alias: true

# ---------------- Mermaid runtime (self-hosted; mike/privacy-safe) ----------------
# Page-relative paths so they resolve under every mike alias (/latest/, /x.y.z/).
# Loaded before Material's bundle checks for a global `mermaid`, so its built-in
# loader (whose privacy-rewritten absolute URL 404s under mike) is skipped.
extra_javascript:
  - media/js/mermaid.min.js
  - media/js/mermaid-init.js

nav:
  - European Digital Identity Wallet: https://eudi.dev/latest/
  - Architecture and Reference Framework: https://eudi.dev/latest/about/
  - Discussion Topics: https://eudi.dev/latest/discussion-topics/
  - Technical Specifications: https://eudi.dev/latest/technical-specifications/
  - Reference Implementation: https://docs.eudi.dev/latest/
  - Functional Conformance:
      - Home: index.md
      - Roadmap: roadmap.md
