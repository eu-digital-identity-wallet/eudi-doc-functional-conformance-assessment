name: Publish draft docs

on:
  push:
    branches:
      - submitted
    # Only republish when the content itself changes. Without this, a README or
    # workflow edit on this branch rebuilds and redeploys the entire site.
    paths:
      - docs/fcaf/**

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'eu-digital-identity-wallet/eudi-doc-functional-conformance-assessment'
    uses: eu-digital-identity-wallet/eudi-doc-functional-conformance-assessment/.github/workflows/pages.yml@site
    with:
      content_ref: submitted
