name: Publish docs + PDFs

on:
  workflow_call:
    inputs:
      content_ref:
        description: Branch or release tag containing docs/fcaf
        required: false
        type: string
        default: submitted
  workflow_dispatch:
    inputs:
      content_ref:
        description: Branch or release tag containing docs/fcaf
        required: true
        type: string
        default: submitted
  release:
    types: [created]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      MKDOCS_MATERIAL_CACHE_DIR: .cache

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: site
          fetch-depth: 0

      # ------------------------------------------------------------
      # Compute version
      # ------------------------------------------------------------
      - name: Compute publish context
        id: ver
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_CONTENT_REF: ${{ inputs.content_ref }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            CONTENT_REF="$RELEASE_TAG"
          else
            CONTENT_REF="${REQUESTED_CONTENT_REF:-submitted}"
          fi

          if [ "$CONTENT_REF" = "submitted" ]; then
            echo "kind=draft" >> "$GITHUB_OUTPUT"
            echo "tag=draft" >> "$GITHUB_OUTPUT"
            echo "version=draft" >> "$GITHUB_OUTPUT"
          elif [[ "$CONTENT_REF" =~ ^v[0-9]+(\.[0-9]+)*([\-+].*)?$ ]]; then
            echo "kind=tag" >> "$GITHUB_OUTPUT"
            echo "tag=${CONTENT_REF}" >> "$GITHUB_OUTPUT"
            echo "version=${CONTENT_REF#v}" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: content_ref must be 'submitted' or a vX.Y.Z release tag, got: '$CONTENT_REF'"
            exit 1
          fi

          echo "content_ref=${CONTENT_REF}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Overlay versioned content onto the site shell
      # ------------------------------------------------------------
      - name: Overlay FCAF content
        shell: bash
        env:
          CONTENT_REF: ${{ steps.ver.outputs.content_ref }}
        run: |
          set -euo pipefail

          if [ -e docs/fcaf ]; then
            echo "ERROR: site must not contain docs/fcaf before the content overlay"
            exit 1
          fi

          git fetch --no-tags origin "$CONTENT_REF"
          git archive --format=tar FETCH_HEAD docs/fcaf | tar -xf -

          test -f docs/fcaf/.nav.yml
          test -f docs/fcaf/index.md

      # ------------------------------------------------------------
      # System deps (Pandoc, LaTeX, SVG tools, fonts, zip)
      # - NO Chromium install (we render mermaid via Docker image)
      # ------------------------------------------------------------
      - name: Install system deps (PDF + SVG)
        if: steps.ver.outputs.kind == 'tag'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            zip \
            librsvg2-bin \
            fonts-noto \
            fonts-noto-color-emoji

      # ------------------------------------------------------------
      # Provide "mmdc" via mermaid-cli Docker image (no browser install)
      # ------------------------------------------------------------
      - name: Provide mmdc via Docker (mermaid-cli)
        if: steps.ver.outputs.kind == 'tag'
        shell: bash
        run: |
          mkdir -p .ci/bin
          cat > .ci/bin/mmdc <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/data" \
            -w /data \
            ghcr.io/mermaid-js/mermaid-cli/mermaid-cli:latest \
            "$@"
          EOF
          chmod +x .ci/bin/mmdc
          echo "${GITHUB_WORKSPACE}/.ci/bin" >> "$GITHUB_PATH"

          # Warm pull so the first render isn't paying the pull penalty mid-build
          docker pull ghcr.io/mermaid-js/mermaid-cli/mermaid-cli:latest

      # ------------------------------------------------------------
      # Python setup
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache MkDocs Material assets
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          path: .cache
          restore-keys: |
            mkdocs-material-${{ runner.os }}-

      - name: Install Python requirements (via Makefile)
        shell: bash
        run: make install_deps

      - name: Add venv to PATH
        shell: bash
        run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      - name: Configure git identity
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # ------------------------------------------------------------
      # Build PDFs
      # ------------------------------------------------------------
      - name: Clean mermaid render cache
        if: steps.ver.outputs.kind == 'tag'
        shell: bash
        run: rm -rf build/mermaid

      - name: Build PDF
        if: steps.ver.outputs.kind == 'tag'
        shell: bash
        run: make pdf VERSION=${{ steps.ver.outputs.version }}

      - name: Zip PDFs
        if: steps.ver.outputs.kind == 'tag'
        shell: bash
        run: make dist VERSION=${{ steps.ver.outputs.version }}

      # ------------------------------------------------------------
      # Deploy MkDocs versioned site
      # ------------------------------------------------------------
      - name: Deploy MkDocs with mike
        shell: bash
        run: |
          if [ "${{ steps.ver.outputs.kind }}" = "draft" ]; then
            make ci_mike_deploy_draft
          else
            make ci_mike_deploy VERSION=${{ steps.ver.outputs.version }}
          fi        

      # ------------------------------------------------------------
      # Package the complete mike site for GitHub Pages
      # ------------------------------------------------------------
      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/pages
          git fetch --no-tags origin gh-pages
          git archive --format=tar FETCH_HEAD | tar -xf - -C build/pages

          test -f build/pages/CNAME
          test -f build/pages/draft/fcaf/index.html

      - name: Replace mike aliases with lightweight redirects
        shell: bash
        run: |
          python3 .github/scripts/materialize_mike_aliases.py \
            build/pages \
            latest \
            latest-draft

          test ! -L build/pages/latest
          test ! -L build/pages/latest-draft
          test -f build/pages/latest/fcaf/index.html
          test -f build/pages/latest-draft/fcaf/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages
          include-hidden-files: true

      # ------------------------------------------------------------
      # Upload artifacts (Actions)
      # ------------------------------------------------------------
      - name: Upload PDFs (artifact)
        if: steps.ver.outputs.kind == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: fcaf-pdfs-${{ steps.ver.outputs.tag }}
          path: build/pdf/*.pdf

      - name: Upload ZIP (artifact)
        if: steps.ver.outputs.kind == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: fcaf-pdfs-zip-${{ steps.ver.outputs.tag }}
          path: build/dist/*.zip

      # ------------------------------------------------------------
      # Attach to GitHub Release
      # ------------------------------------------------------------
      - name: Upload assets to GitHub Release
        if: steps.ver.outputs.kind == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            build/pdf/*.pdf
            build/dist/*.zip

  deploy:
    needs: publish
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
